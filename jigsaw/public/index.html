<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jigsaw Puzzle</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/lobby.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1 class="header-title">Jigsaw Puzzle <span>Multiplayer</span></h1>
      <div id="auth-area" class="auth-area"></div>
    </header>

    <!-- Tabs -->
    <div class="lobby-tabs">
      <button class="lobby-tab active" data-tab="rooms">Rooms</button>
      <button class="lobby-tab" data-tab="leaderboard">Leaderboard</button>
    </div>

    <!-- Rooms Tab -->
    <div id="tab-rooms" class="tab-content active">
      <!-- Toolbar -->
      <div class="toolbar">
        <h2>Available Rooms</h2>
        <button id="create-room-btn" class="btn btn-primary btn-lg">+ Create Room</button>
      </div>

      <!-- Room Grid -->
      <div id="room-grid" class="room-grid"></div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" style="display:none">
        <div class="empty-state-icon">&#129513;</div>
        <h3>No rooms yet</h3>
        <p>Be the first to create a puzzle room and invite your friends to join!</p>
      </div>
    </div>

    <!-- Leaderboard Tab -->
    <div id="tab-leaderboard" class="tab-content" style="display:none">
      <div class="toolbar">
        <h2>Top Players</h2>
      </div>
      <div id="leaderboard-content" class="leaderboard-wrap">
        <div class="profile-loading">Loading leaderboard...</div>
      </div>
    </div>

    <!-- Create Room Modal -->
    <div id="modal-backdrop" class="modal-backdrop">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h2>Create a Room</h2>
        <div id="form-error" class="error-msg"></div>
        <form id="create-room-form">
          <div class="form-group">
            <label for="room-name">Room Name</label>
            <input type="text" id="room-name" class="form-input" placeholder="My Puzzle Room" maxlength="60" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="piece-count">Pieces</label>
              <select id="piece-count" class="form-input">
                <option value="24">24 pieces</option>
                <option value="48" selected>48 pieces</option>
                <option value="100">100 pieces</option>
                <option value="200">200 pieces</option>
              </select>
            </div>
            <div class="form-group">
              <label for="room-mode">Mode</label>
              <select id="room-mode" class="form-input">
                <option value="coop">Co-op</option>
                <option value="race">Race</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Puzzle Image</label>
            <div id="image-picker" class="image-picker"></div>
            <div class="upload-area">
              <label class="upload-btn-label">
                <input type="file" id="image-upload" accept="image/*">
                &#x2B06; Upload custom image
              </label>
            </div>
          </div>
          <div id="guest-fields" class="form-group" style="display:none">
            <label for="guest-name">Guest Name</label>
            <input type="text" id="guest-name" class="form-input" placeholder="Your name" maxlength="30">
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:0.5rem">Create Room</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/lobby.js"></script>
</body>
</html>
