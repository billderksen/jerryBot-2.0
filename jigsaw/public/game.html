<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jigsaw Puzzle</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/game.css">
</head>
<body>
  <div id="game-container">
    <!-- Main puzzle area -->
    <div id="puzzle-area">
      <canvas id="puzzle-canvas"></canvas>

      <!-- Connection status indicator -->
      <div id="connection-indicator">
        <span id="connection-status" class="status-dot connected" title="Connected"></span>
      </div>

      <!-- Floating action buttons (mobile) -->
      <div class="fab-container">
        <button id="fab-center" class="fab" title="Center Board">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
          </svg>
        </button>
        <button id="fab-fit-all" class="fab" title="Fit All Pieces">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
          </svg>
        </button>
      </div>

      <!-- Waiting overlay (shown before game starts) -->
      <div id="waiting-overlay">
        <div id="waiting-message">
          <div class="waiting-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
          </div>
          <h2>Waiting for host to start...</h2>
          <p id="room-name-display"></p>
          <p id="player-count-display"></p>
          <button id="start-btn" class="btn btn-primary btn-lg" style="display:none">Start Game</button>
        </div>
      </div>

      <!-- Completion overlay (shown when puzzle is done) -->
      <div id="completion-overlay" style="display:none">
        <div id="completion-content">
          <div class="completion-icon">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <h2>Puzzle Complete!</h2>
          <div id="final-scores"></div>
          <button id="back-to-lobby" class="btn btn-primary btn-lg">Back to Lobby</button>
        </div>
      </div>
    </div>

    <!-- Sidebar (desktop) / Bottom drawer (mobile) -->
    <div id="sidebar">
      <div id="sidebar-handle" class="mobile-only">
        <div class="handle-bar"></div>
      </div>

      <!-- Room info -->
      <div id="room-info-section">
        <h3 id="sidebar-room-name">Puzzle Room</h3>
        <div id="room-badges">
          <span id="mode-badge" class="badge"></span>
          <span id="ranked-badge" class="badge"></span>
          <span id="piece-badge" class="badge"></span>
        </div>
        <div id="progress-container">
          <div id="progress-track">
            <div id="progress-bar"></div>
          </div>
          <span id="progress-text">0/0 (0%)</span>
        </div>
      </div>

      <!-- Player list -->
      <div id="player-section">
        <h4>Players</h4>
        <div id="player-list"></div>
      </div>

      <!-- Chat -->
      <div id="chat-section">
        <h4>Chat</h4>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <input type="text" id="chat-input" class="form-input" placeholder="Type a message..." maxlength="200" autocomplete="off">
          <button id="chat-send" class="btn btn-primary">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/game.js"></script>
</body>
</html>
