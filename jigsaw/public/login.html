<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Jigsaw Puzzle</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/lobby.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to track your stats and join ranked games</p>
    <div id="error-msg" class="error-msg"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Login</button>
    </form>
    <div class="divider">or</div>
    <a href="/auth/discord" class="btn btn-discord btn-lg">Login with Discord</a>
    <a href="/" class="btn btn-ghost btn-lg" style="margin-top:0.5rem">Play as Guest</a>
    <div class="footer-link">
      Don't have an account? <a href="/register.html">Register</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          errorMsg.textContent = data.error || 'Invalid username or password';
          errorMsg.classList.add('visible');
        }
      } catch {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.add('visible');
      }
    });
  </script>
</body>
</html>
