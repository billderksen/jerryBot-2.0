<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Jigsaw Puzzle</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/lobby.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Register to save your progress and compete on leaderboards</p>
    <div id="error-msg" class="error-msg"></div>
    <form id="register-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Choose a username" minlength="3" maxlength="30" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Choose a password" minlength="4" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Register</button>
    </form>
    <a href="/" class="btn btn-ghost btn-lg" style="margin-top:0.75rem">Play as Guest</a>
    <div class="footer-link">
      Already have an account? <a href="/login.html">Login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          errorMsg.textContent = data.error || 'Registration failed';
          errorMsg.classList.add('visible');
        }
      } catch {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.add('visible');
      }
    });
  </script>
</body>
</html>
